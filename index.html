<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleverPay — Compliance Portal v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cp-styles1.css">
<link rel="stylesheet" href="cp-styles2.css">
</head>
<body>
<div id="login-screen">
  <div class="lbox">
    <div class="llogo">
      <div class="llogo-ic">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      </div>
      <div>
        <div class="llogo-nm"><span>Clever</span>Pay</div>
        <div class="llogo-sub">HAF Compliance Portal · v3</div>
      </div>
    </div>
    <div class="lfield">
      <label>Username</label>
      <input type="text" id="lu" placeholder="Enter username" autocomplete="off">
    </div>
    <div class="lfield">
      <label>Password</label>
      <input type="password" id="lp" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="lbtn" onclick="doLogin()">Sign in</button>
    <div class="lerr" id="lerr">Incorrect username or password.</div>
  </div>
</div>
<div id="app">
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-ic">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      </div>
      <div>
        <div class="brand-nm"><span>Clever</span>Pay</div>
        <div class="brand-tg">Compliance Portal</div>
      </div>
    </div>
    <div class="ustrip">
      <div class="uav" id="s-av">??</div>
      <div>
        <div class="unm" id="s-nm">—</div>
        <div class="url" id="s-rl">—</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nlbl">Review</div>
      <button class="nb active" id="nb-dashboard" onclick="showPage('dashboard')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard
      </button>
      <button class="nb" id="nb-queue" onclick="showPage('queue')">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Review Queue
        <span class="nbbadge a" id="nb-queue-badge">3</span>
      </button>
      <div class="nsep"></div>
      <div class="nlbl">Inboxes</div>
      <button class="nb" id="nb-gdrive" onclick="showPage('gdrive')">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Google Drive
      </button>
      <button class="nb" id="nb-cpdirect" onclick="showPage('cpdirect')">
        <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>CP Direct
      </button>
      <div class="nsep"></div>
      <div class="nlbl">Drivers</div>
      <button class="nb" id="nb-crm" onclick="showPage('crm')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Driver CRM
      </button>
      <button class="nb" id="nb-missing" onclick="showPage('missing')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Missing Docs
        <span class="nbbadge" id="nb-missing-badge">2</span>
      </button>
      <button class="nb" id="nb-expiry" onclick="showPage('expiry')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Expiry &amp; Renewals
      </button>
      <button class="nb" id="nb-rag" onclick="showPage('rag')">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>RAG Board
      </button>
      <div class="nsep"></div>
      <div class="nlbl">Integrations</div>
      <button class="nb" id="nb-plnasync" onclick="showPage('plnasync')">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>PLNA Sync
      </button>
      <button class="nb" id="nb-knect" onclick="showPage('knect')">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>KNECT Eligibility
      </button>
      <div class="nsep"></div>
      <div class="nlbl">Communication</div>
      <button class="nb" id="nb-messages" onclick="showPage('messages')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Messages
      </button>
      <button class="nb" id="nb-audit" onclick="showPage('audit')">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Audit Trail
      </button>
      <div class="nsep"></div>
      <div class="nlbl">Management</div>
      <button class="nb" id="nb-reports" onclick="showPage('reports')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Reports
      </button>
      <button class="nb" id="nb-docrules" onclick="showPage('docrules')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41"/><path d="M4.93 4.93l1.41 1.41"/><path d="M19.07 19.07l-1.41-1.41"/><path d="M4.93 19.07l1.41-1.41"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>Doc Rules
      </button>
      <button class="nb" id="nb-settings" style="display:none" onclick="showPage('settings')">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>Settings
        <span style="font-size:9px;margin-left:auto;opacity:.5;font-weight:700;">Admin</span>
      </button>
      <div class="nsep"></div>
      <div class="nlbl">HAF Network</div>
      <a href="haf-index.html" class="nb">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>HAF Hub<span class="nb-ext">→</span>
      </a>
      <a href="knect-v2.html" class="nb">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>HAF KNECT<span class="nb-ext">→</span>
      </a>
      <a href="plna-github/dashboard.html" class="nb">
        <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>HAF PLNA<span class="nb-ext">→</span>
      </a>
    </nav>
    <div class="sfoot">
      <div class="throw">
        <span>
          <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Theme
        </span>
        <button class="ttog" onclick="toggleTheme()">
          <div class="knob">
            <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/></svg>
            <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </div>
        </button>
      </div>
      <button class="sbtn" onclick="doLogout()">Sign out</button>
    </div>
  </aside>
  <main class="workspace">
    <div class="topbar">
      <div class="tb-ttl" id="tb-ttl">CLEVERPAY · <b>DASHBOARD</b></div>
      <div class="tb-act" id="tb-act"></div>
    </div>
    <div class="canvas" id="canvas"></div>
  </main>
</div>
</div>
<div class="mbg" id="edit-modal">
  <div class="mbox">
    <div class="mhead">
      <h2 id="edit-modal-title">Edit Compliance</h2>
      <button class="mcls" onclick="closeModal('edit-modal')">×</button>
    </div>
    <div id="edit-modal-body"></div>
  </div>
</div>
<script src="cp-data.js"></script>
<script src="cp-pages1.js"></script>
<script src="cp-pages2.js"></script>
<script src="cp-pages2b.js"></script>
<script src="cp-pages3.js"></script>
</body>
</html>
